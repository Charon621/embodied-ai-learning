name: Validate curriculum and CPU labs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_repo.py --run-labs --seeds 7,19,42
